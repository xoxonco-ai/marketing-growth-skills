name: Validate skills

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install PyYAML
      run: python -m pip install pyyaml
    - name: Validate skills
      run: python scripts/validate_skills.py
